[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ream"
version = "1.0.0"
description = "REAM: a Reliability-Audit framework for Explainable Malware detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sheikh Shah Mohammad Motiur Rahman" },
  { name = "Takia Islam" },
]
keywords = [
  "explainable AI", "trustworthy machine learning", "Android malware detection",
  "SHAP", "LIME", "faithfulness", "stability", "audit framework",
]
dependencies = [
  "lightgbm>=4.0",
  "shap>=0.44",
  "lime>=0.2",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.scripts]
ream = "ream.run:main"

[tool.setuptools]
packages = ["ream", "ream.core", "ream.contributions"]
